name: Robovac

on:
  schedule:
    - cron: '17 6 * * *'   # once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency: robovac

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw Robovac on the contribution graph
        run: python3 robovac/robovac.py ${{ github.repository_owner }} dist
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || { git commit -m "Robovac: redraw the contribution graph" && git push; }
